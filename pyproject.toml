[project]
name = "langraph-only"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "langchain-core>=1.7.1",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.1",
]

[project.scripts]
nlt = "langchain_only.chain:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "langchain_only"
